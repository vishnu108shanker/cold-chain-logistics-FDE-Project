services:
  postgres:
    image: postgres:17
    container_name: cold-chain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cold-chain-postgres
      POSTGRES_USER: me
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_new:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U me -d cold-chain-postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: cold-chain-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres_data_new:
